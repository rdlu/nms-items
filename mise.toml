# mise (https://mise.jdx.dev) — tools + tasks for NMSii.
#
#   mise install     # typst + uv + node, pinned below
#   mise run setup   # fonts, potrace, resvg, imagemagick (paru)
#   mise run sync    # Python deps
#   mise run tui     # the app
#   mise run refresh # re-extract the game's tables and rebuild everything
#
# Same shape as the minecraft-tui project: uv owns the Python side, typst owns
# the PDF side, and every routine action is a task so nothing has to be
# remembered: the everyday ones at the bottom of this file, the rest as
# scripts in mise-tasks/ (see "tasks" below).

[tools]
uv = "latest"
typst = "latest"
# The site's build. The one place its version is set: the Pages workflow
# installs node through mise from this line, so a bump is this line only.
# Tracks the newest LTS; `mise run deps:outdated` shows when there is one.
node = "24"

# Decompiles the game's .MBIN tables to readable MXML for `mise run extract:all`.
# Pinned, not "latest": each release targets one game version's struct
# layouts, so after a patch bump this to the release made for it (list them
# with `mise run mbin:releases`) and check with `mise run game:version`. The
# linux asset is a self-contained single-file binary, so no .NET is needed.
#
# v7.04.1-pre3 is the last full release before Cosmos 7.05 and 7.06, neither
# of which needed a new one; on build 180836 (7.06) it decompiles every table
# byte-for-byte the same as the v7.07.0-pre1 pre-release.
[tools."github:monkeyman192/MBINCompiler"]
version = "v7.04.1-pre3"
asset_pattern = "MBINCompiler-linux"
bin = "MBINCompiler"
format = "raw"

[env]
# Keep uv's venv in-repo and importable without installing the package.
UV_PROJECT_ENVIRONMENT = "{{config_root}}/.venv"
PYTHONPATH = "{{config_root}}/src"


# --- tasks ------------------------------------------------------------------
#
# Only the everyday entry points live here. Everything else is a file task in
# mise-tasks/<group>/<name>, which mise names group:name; `mise tasks` lists
# them all:
#
#   web:*      the static site (nmsii.dlu.one): data, md, dev, check, build, site
#   pages:*    GitHub Pages settings: setup, https, status
#   contrib:*  shared portal addresses: validate, setup, pending
#   box:*      containers (podman): tui, site, build
#   tui:*      the app's side tools: console, serve, screenshot
#   test:*     the suite in parallel (fast), and slices of it: web, md, mcp
#   mcp:*      the MCP server for AI assistants: serve, inspect, config,
#              install-claude|codex|opencode|goose|pi, uninstall
#   extract:*  the game's tables: unpack, decompile, convert, all, diff
#   game:version, mbin:releases   which build is installed, which decompiler reads it
#   data:*     normalise into data/: fetch, build, cheatsheet, glyphs, refresh-handbook
#   pdf:*      the cheat sheet: build, watch
#   deps:*     outdated
#   ci:local   check + lint:shell, what pull-request CI runs
#   lint:shell bash -n and shellcheck over the shell scripts
#   hooks:*    the git hooks in .githooks/: install, uninstall, run, status
#   deploy     merge a green PR (gh), then follow the Pages run
#
# Most of the old flat names (web-build, pdf, extract, validate-locations, ...)
# still work as aliases of the new ones.

[tasks.setup]
description = "System deps: the two fonts the PDF uses, potrace for the glyphs, resvg + imagemagick for the favicon"
run = "paru -S --needed inter-font ttf-jetbrains-mono potrace resvg imagemagick"

[tasks.sync]
description = "Install / update Python dependencies (textual, plus hgpaktool for the game extract)"
run = "uv sync --extra dev --extra extract"

[tasks.tui]
description = "Open the recipe browser"
run = "uv run python -m nms_items"
alias = "run"

[tasks.dev]
description = "Run the TUI with live CSS reload (edit app.tcss and watch it apply); `mise run tui:console` in a second terminal"
run = "uv run textual run --dev nms_items.app:RecipeApp"

[tasks.test]
description = "Run the test suite (data integrity + a headless pass over the TUI), in parallel as test:fast"
run = [{ task = "test:fast" }]

[tasks.check]
description = "Everything CI runs before a deploy: the full test suite, the components, the shared addresses and the site build"
depends = ["test", "web:check"]
run = [{ task = "contrib:validate" }, { task = "web:build" }]

# In order, not as `depends`: mise runs a task's dependencies in parallel, and
# each step here reads what the one before it wrote.
[tasks.refresh]
description = "Full data rebuild after a game patch, from the installed game: extract → cheat sheet → PDF"
run = [{ task = "extract:all" }, { task = "pdf:build" }]

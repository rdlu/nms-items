# Contributed portal addresses: check issues filed with the "Share a portal
# address" form, and turn an accepted one into a pull request. A pull request
# that edits data/locations.json by hand is ci.yml's: when that file is the
# whole change, its `check` job runs only `portal_issue.py validate`, and a
# change to the bot's script or src/ runs the full suite there.
#
# The issue body is untrusted. It never reaches a shell: scripts/portal_issue.py
# reads it from the event file. Only numbers from the event are interpolated;
# the author's login reaches the shell only as an environment variable.
name: Contributions

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: read

jobs:
  check-issue:
    if: >-
      github.event_name == 'issues' && github.event.action != 'labeled' &&
      contains(github.event.issue.labels.*.name, 'portal-address')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # A burst of edits to one issue only needs its last one checked.
    concurrency:
      group: contrib-check-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      AUTHOR: ${{ github.event.issue.user.login }}
    steps:
      - uses: actions/checkout@v7
      # The author's open submissions, for the per-author cap. The script
      # drops this issue from the count and exempts the owner and anyone
      # with write access (author_association, read from the event file).
      - run: >-
          gh issue list -R "$GITHUB_REPOSITORY" --author "$AUTHOR"
          --label portal-address --state open --limit 20 --json number > open.json
      - id: check
        run: python3 scripts/portal_issue.py check --open open.json --out reply.md
      # On hold: say so once. Further edits while it stays on hold are quiet.
      - if: >-
          steps.check.outputs.held == 'true' &&
          !contains(github.event.issue.labels.*.name, 'on-hold')
        run: |
          gh issue comment "$ISSUE" --edit-last --create-if-none --body-file reply.md
          gh issue edit "$ISSUE" --add-label on-hold
      - if: steps.check.outputs.held != 'true'
        run: gh issue comment "$ISSUE" --edit-last --create-if-none --body-file reply.md
      - if: >-
          steps.check.outputs.held != 'true' &&
          contains(github.event.issue.labels.*.name, 'on-hold')
        run: gh issue edit "$ISSUE" --remove-label on-hold
      - if: steps.check.outputs.held != 'true' && steps.check.outputs.valid == 'true'
        run: gh issue edit "$ISSUE" --add-label valid --remove-label needs-fix
      - if: steps.check.outputs.held != 'true' && steps.check.outputs.valid != 'true'
        run: gh issue edit "$ISSUE" --add-label needs-fix --remove-label valid

  # The repo owner adds `accepted`; the bot writes the entry and opens a PR
  # that closes the issue. PRs opened with this token do not trigger other
  # workflows, so the whole file is validated here before it is pushed, and
  # the job then reports the required `check` status on the PR's head itself
  # (`vouch`): ci.yml would run exactly that validation and nothing more.
  accept-issue:
    if: >-
      github.event_name == 'issues' && github.event.action == 'labeled' &&
      github.event.label.name == 'accepted' &&
      github.event.sender.login == github.repository_owner &&
      contains(github.event.issue.labels.*.name, 'portal-address')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Its own group, never cancelled: an edit landing mid-accept must not
    # leave a half-pushed branch behind.
    concurrency:
      group: contrib-accept-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v7
      - id: apply
        run: python3 scripts/portal_issue.py apply --out reply.md
      - if: steps.apply.outputs.valid != 'true'
        run: |
          gh issue comment "$ISSUE" --edit-last --create-if-none --body-file reply.md
          gh issue edit "$ISSUE" --remove-label accepted --add-label needs-fix
          exit 1
      - run: python3 scripts/portal_issue.py validate
      - run: |
          branch="portal/issue-$ISSUE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/locations.json
          git commit -m "Add the portal address from #$ISSUE"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --json number -q '.[0].number')" ]; then
            gh pr create --head "$branch" --base main \
              --title "Add the portal address from #$ISSUE" \
              --body "Adds the address checked in #$ISSUE to data/locations.json as \`shared\`, crediting its author.

          Closes #$ISSUE"
          fi
      # Last, once the branch and the PR exist: validates the file again and
      # posts `check` = success on the commit just pushed, linking this run.
      - run: python3 scripts/portal_issue.py vouch "$(git rev-parse HEAD)"

# Checks for pull requests: everything the Pages workflow builds before it
# uploads (svelte-check, the export, the site build), plus the test suite and a
# lint of the shell scripts, without deploying. `mise run ci:local` runs the
# same locally, and the git hooks (`mise run hooks:install`) run most of it on
# commit and push; this is the gate for what arrives without them: Dependabot,
# forks, contributors.
#
# `check` is the required status check on main, so it must report on every
# pull request: no workflow-level path filter, which would leave a docs-only PR
# waiting forever for a check that never starts. Instead scripts/changes.sh
# skips what a change cannot affect, inside the job: prose alone is a checkout
# and a diff, and a change to data/locations.json alone (a portal address) is
# the strict validation of that file and nothing else. The contributions bot's
# own pull requests never start this workflow (a PR opened with GITHUB_TOKEN
# triggers nothing); contrib.yml posts their `check` status itself.
#
# Billed minutes, not wall time, are what this is shaped around. GitHub rounds
# every job up to a whole minute, so it is one job that runs its steps in
# sequence and skips the ones the change cannot affect, rather than parallel
# jobs that would each bill a minute. Pull requests only, no branch pushes, so
# a commit is not built twice. A draft skips the job, which GitHub counts as a
# pass, but a draft cannot be merged; ready_for_review runs it for real.
#
# Read-only and secret-free, so it is safe on pull requests from forks and
# from Dependabot: plain `pull_request`, never `pull_request_target`.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the pull request supersedes the run before it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the export dates data/ by its last commit, and the
          # change filter below diffs against the base.
          fetch-depth: 0

      # Which steps this change needs; a manual run does everything.
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            git diff --name-only "$BASE" HEAD | tee /dev/stderr | scripts/changes.sh >>"$GITHUB_OUTPUT"
          else
            printf 'python=full\nweb=true\nlocations=true\n' >>"$GITHUB_OUTPUT"
          fi

      # A second, so it always runs: bash -n and shellcheck over the scripts.
      - run: mise-tasks/lint/shell

      # The shared addresses, strictly: what a portal-address PR needs, and
      # all it gets when that file is the whole change. The runner's python3
      # is enough (the script needs only src/), so no uv and no node.
      - if: steps.changes.outputs.locations == 'true'
        run: python3 scripts/portal_issue.py validate

      # uv, node from mise.toml, uv sync, npm ci: shared with pages.yml.
      - if: steps.changes.outputs.python != 'none' || steps.changes.outputs.web == 'true'
        uses: ./.github/actions/setup

      # The whole suite, or for a site-only change the slice that reads the
      # site's source (core.js against the Python, storage keys, routes).
      - if: steps.changes.outputs.python == 'full'
        run: uv run pytest -n auto --dist worksteal
      - if: steps.changes.outputs.python == 'web'
        run: uv run pytest -n auto --dist worksteal tests/test_web.py tests/test_markdown.py

      - if: steps.changes.outputs.web == 'true'
        run: npm run check
      # The export first: it writes into web/, which the build copies into dist/.
      - if: steps.changes.outputs.web == 'true'
        run: uv run python scripts/build_web.py
      - if: steps.changes.outputs.web == 'true'
        run: npm run build

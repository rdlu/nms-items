# Publish the site to GitHub Pages at nmsii.dlu.one: export data.json from the
# Python side into web/, build the Svelte page around it into dist/, upload
# dist/. Needs Settings -> Pages -> Source set to "GitHub Actions", and
# the custom domain set there too: a CNAME file is ignored by Actions deploys.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # No test suite here, deliberately: it was most of this job's time, and every
  # change reaches main through a pull request whose required `check` passed
  # (ci.yml, or the contributions bot's own validation for a portal address).
  # The type check stays, as a last guard before a broken page goes live.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: llms.txt dates the recipe data by data/'s last commit,
          # which a shallow clone cannot see.
          fetch-depth: 0
      # uv, node from mise.toml, uv sync, npm ci: shared with ci.yml.
      - uses: ./.github/actions/setup
      - run: npm run check
      # The export first: it writes into web/, which the build copies into dist/.
      - run: uv run python scripts/build_web.py
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
